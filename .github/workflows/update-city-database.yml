name: Update world city database

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-city-db.py'
      - '.github/workflows/update-city-database.yml'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

jobs:
  update-cities:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GeoNames city index
        run: python3 scripts/build-city-db.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No city database changes."
          else
            git commit -m "chore: update world city database"
            git push
          fi
