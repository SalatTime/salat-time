name: Update world city database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

jobs:
  update-cities:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GeoNames city index
        run: python3 scripts/build-city-db.py

      - name: Commit updated city database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cities data/city-manifest.json data/GEONAMES-ATTRIBUTION.txt
          if git diff --cached --quiet; then
            echo "No city database changes."
          else
            git commit -m "chore: update world city database"
            git push
          fi
