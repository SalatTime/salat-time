name: Enable multilingual presentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add multilingual layer once
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="i18n-v2.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>',f'  {tag}\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "salat-time-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable multilingual prayer names and dates"
          git push
