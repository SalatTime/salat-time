name: Enable visual refinement
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visual stylesheet once
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<link rel="stylesheet" href="visual-v2.css?v=1">'
          if tag not in s:
              s=s.replace('</head>',f'  {tag}\n</head>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "salat-time-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refine visual design"
          git push
